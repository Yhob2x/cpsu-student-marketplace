; PHP-FPM pool for the CPSU Student Marketplace. Copy to /etc/php/8.2/fpm/pool.d/cpsu-marketplace.conf.
[cpsu-marketplace]
user = marketplace
group = marketplace
listen = /run/php/cpsu-marketplace.sock
listen.owner = www-data
listen.group = www-data

; Load testing on 20 CPU threads showed 16 workers sustaining about 500 requests per second.
; Size this to the approved server and test again there.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

php_admin_value[expose_php] = Off
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 5M
php_admin_value[memory_limit] = 256M
php_admin_flag[opcache.enable] = On
php_admin_flag[opcache.validate_timestamps] = Off
