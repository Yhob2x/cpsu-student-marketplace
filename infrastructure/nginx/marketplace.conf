# CPSU Student Marketplace: Nginx in front of Laravel (PHP-FPM).
# Replace marketplace.example.edu.ph and the FPM socket, then issue a certificate (e.g. certbot --nginx).
server {
  listen 80;
  server_name marketplace.example.edu.ph;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name marketplace.example.edu.ph;
  ssl_certificate     /etc/letsencrypt/live/marketplace.example.edu.ph/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/marketplace.example.edu.ph/privkey.pem;
  client_max_body_size 4m;   # photo uploads are capped at 3 MB by the application

  # Only the public folder is web-accessible. Source, .env and uploaded photos stay outside it.
  root /var/www/cpsu-marketplace/public;
  index index.php;

  location ~ /\.(?!well-known) { deny all; }
  # Readiness is for local monitoring only.
  location = /internal/ready { deny all; }

  # Allow the PWA service worker and manifest to refresh after deployment.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /offline.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  # Hashed Vite assets are content-addressed and can safely be cached for a year.
  location ^~ /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Browser WebSocket handshake only. Never proxy the Reverb /apps publishing API.
  location ^~ /app/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location ^~ /apps/ { return 404; }

  # Everything else, including /api, is handled by Laravel.
  location / { try_files $uri /index.php?$query_string; }
  location = /index.php {
    fastcgi_pass unix:/run/php/cpsu-marketplace.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_hide_header X-Powered-By;
  }
  location ~ \.php$ { return 404; }
}
