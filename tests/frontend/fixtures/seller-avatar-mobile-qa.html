<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CPSU Avatar Mobile UI - Synthetic Test Only</title>
<style>html,body{margin:0!important;padding:0!important}body{overflow-x:hidden}#qa-root{box-sizing:border-box;width:100%;margin:0 auto;padding:8px;max-width:100%}</style>
</head>
<body data-avatar-qa-result="RUNNING">
<div id="qa-root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { MemoryRouter } from 'react-router-dom';
import '../../../resources/css/styles.css';
import '../../../resources/css/student-emphasis.css';
import '../../../resources/css/mobile-refinements.css';
import { SellerAvatarEditor } from '../../../resources/js/seller-avatar-editor.tsx';

const size = Number(new URL(location.href).searchParams.get('width') || 390);
document.body.style.width = size+'px';
document.documentElement.style.width = size+'px';
const result = [];
const tiny = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl4OpQAAAAASUVORK5CYII=';
let currentUrl=tiny;
let mode='reject';
let pending=null;
const mockFetch = async (request, options={}) => {
  const path = new URL(typeof request==='string' ? request : request.url,location.origin).pathname;
  if(path==='/api/v1/seller/store' && (!options.method || options.method==='GET')){
    return Response.json({id:987654,storeName:'Temporary UI Test Store',avatarUrl:currentUrl});
  }
  if(path==='/api/v1/seller/store/avatar'){
    if(options.method==='DELETE'){currentUrl=null;return new Response(null,{status:204});}
    if(mode==='reject'){
      return Response.json({error:{code:'avatar_explicit_content',message:'Rejected test photo'}},{status:422});
    }
    if(mode==='uncertain'){
      return Response.json({error:{code:'avatar_uncertain_content',message:'Uncertain test photo'}},{status:422});
    }
    if(mode==='busy'){
      return await new Promise(resolve=>{pending=resolve});
    }
    currentUrl=tiny+'#new';
    return Response.json({avatarUrl:currentUrl});
  }
  return Response.json({error:{code:'unexpected_mock_request'}},{status:404});
};
window.fetch=mockFetch;
window.confirm=()=>true;
const app=createRoot(document.getElementById('qa-root'));
app.render(React.createElement(MemoryRouter,null,React.createElement(SellerAvatarEditor,{storeId:987654})));
const pause=()=>new Promise(resolve=>setTimeout(resolve,30));
const waitFor=async(predicate,ms=6000)=>{
  const deadline=Date.now()+ms;
  while(Date.now()<deadline){if(predicate())return true;await pause();}
  return false;
};
function check(ok,description){result.push({description,pass:Boolean(ok)});if(!ok)throw new Error(description);}
const visible=()=>document.getElementById('qa-root');
try {
 check(await waitFor(()=>document.querySelector('input[type="file"]')&&document.querySelector('.seller-avatar--large img')),'store and current avatar rendered');
 const root=visible().getBoundingClientRect();
 const fileInput=document.querySelector('input[type="file"]');
 const picker=fileInput.getBoundingClientRect();
 check(picker.left>=-1 && picker.right<=root.right+2,'native file input does not overflow mobile frame');
 check(document.documentElement.scrollWidth<=Math.max(size,window.innerWidth)+1,'no horizontal page overflow');
 const safePng=Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl4OpQAAAAASUVORK5CYII='),c=>c.charCodeAt(0));
 const item=new File([safePng],'synthetic.png',{type:'image/png'});
 const dt=new DataTransfer();dt.items.add(item);
 fileInput.files=dt.files;
 fileInput.dispatchEvent(new Event('change',{bubbles:true}));
 check(await waitFor(()=>document.querySelectorAll('.seller-avatar--large').length===2),'selected photo preview appears');
 let button=document.querySelector('button[type="submit"]');
 check(!button.disabled,'submit enabled for supported selected file');
 button.click();
 check(await waitFor(()=>document.body.textContent.includes('explicit content')),'explicit rejection message shown');
 check(await waitFor(()=>!document.querySelector('button[type="submit"]').disabled),'form becomes usable after rejection');
 check(document.querySelector('small')?.textContent.includes('Current public picture'),'previous picture remains visible after rejection');
 mode='uncertain';
 button=document.querySelector('button[type="submit"]');button.click();
 check(await waitFor(()=>document.body.textContent.includes('cannot confirm')),'uncertain rejection message shown');
 check(await waitFor(()=>!document.querySelector('button[type="submit"]').disabled),'form becomes usable after uncertain rejection');
 mode='busy';
 button=document.querySelector('button[type="submit"]');button.click();
 check(await waitFor(()=>document.body.textContent.includes('Uploading and checking')),'busy state announces scanning');
 check(document.querySelector('button[type="submit"]').disabled,'submit disabled while screening');
 check(document.querySelector('form[aria-busy="true"]')!==null,'form exposes aria-busy');
 currentUrl=tiny+'#replacement';
 const complete=pending;
 check(typeof complete==='function','in-flight request is intercepted');
 complete(Response.json({avatarUrl:currentUrl}));
 check(await waitFor(()=>document.body.textContent.includes('Profile picture updated')),'successful synthetic upload confirms publication');
 check(document.querySelectorAll('.seller-avatar--large').length===1,'selected photo preview removed after upload');
 document.querySelector('.seller-avatar-editor__remove').click();
 check(await waitFor(()=>document.body.textContent.includes('Profile picture removed')),'seller can remove current photo');
 document.body.dataset.avatarQaResult='PASS';
} catch(error) {
 document.body.dataset.avatarQaResult='FAIL';
 document.body.dataset.avatarQaError=String(error?.message || error);
 document.body.dataset.avatarQaLastMessage=(document.querySelector('.seller-avatar-editor__feedback')?.textContent||'').slice(0,160);
}
document.body.dataset.avatarQaWidth=String(size);
document.body.dataset.avatarQaChecks=JSON.stringify(result);
</script>
</body>
</html>
