# Replace marketplace.example.edu.ph, then issue a certificate (e.g. certbot --nginx).
server {
  listen 80;
  server_name marketplace.example.edu.ph;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name marketplace.example.edu.ph;
  ssl_certificate     /etc/letsencrypt/live/marketplace.example.edu.ph/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/marketplace.example.edu.ph/privkey.pem;
  client_max_body_size 4m;   # image uploads are capped at 3 MB by the API

  root /var/www/cpsu-marketplace/web;   # output of: npm -w apps/web run build
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Allow the PWA service worker and manifest to refresh after deployment.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  # Mobile and desktop share this single React frontend.
  location / { try_files $uri /index.html; }
}
